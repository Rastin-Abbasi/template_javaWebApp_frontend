<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <form id="assetForm">
    <label for="assetNumber">Asset Number:</label>
    <input type="text" id="assetNumber" name="assetNumber" maxlength="10" required>
    
    <label for="assetName">Asset Name:</label>
    <input type="text" id="assetName" name="assetName" required>
    
    <label for="assetSpecs">Specifications:</label>
    <input type="text" id="assetSpecs" name="assetSpecs" required>
    
    <label for="purchaseDate">Purchase Date:</label>
    <input type="text" id="purchaseDate" name="purchaseDate" pattern="\d{4}-\d{2}-\d{2}" required>
    
    <label for="purchasePrice">Purchase Price:</label>
    <input type="number" id="purchasePrice" name="purchasePrice" step="0.01" required>
    
    <button type="submit">Register Asset</button>
  </form>
  
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
